    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // A stored choice wins; a first visit follows the OS setting.
      try {
        var t = localStorage.getItem('gb-theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#fafcf6' : '#0a0e09'
        var l = localStorage.getItem('gb-lang')
        if (l === 'sk' || l === 'en') document.documentElement.lang = l
      } catch (e) {}
    </script>
